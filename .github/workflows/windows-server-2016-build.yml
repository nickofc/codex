name: windows-server-2016-build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64 MSVC binaries
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Build Codex Windows binaries
        shell: pwsh
        run: |
          $env:RUSTFLAGS = ""
          cargo build --release --target x86_64-pc-windows-msvc --bin codex --bin codex-command-runner --bin codex-windows-sandbox-setup

      - name: Stage binaries
        shell: pwsh
        run: |
          $target = "target\x86_64-pc-windows-msvc\release"
          $stage = "$target\stage-windows-server-2016"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$target\codex.exe" $stage
          Copy-Item "$target\codex-command-runner.exe" $stage
          Copy-Item "$target\codex-windows-sandbox-setup.exe" $stage

      - name: Verify ResizePseudoConsole is not a static import
        shell: pwsh
        run: |
          $target = "target\x86_64-pc-windows-msvc\release"
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if (-not $dumpbin) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $candidate = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
            $dumpbin = $candidate.FullName
          } else {
            $dumpbin = $dumpbin.Source
          }

          foreach ($exe in @("codex.exe", "codex-command-runner.exe", "codex-windows-sandbox-setup.exe")) {
            $imports = & $dumpbin /imports "$target\$exe"
            if ($imports -match "ResizePseudoConsole") {
              Write-Error "$exe statically imports ResizePseudoConsole"
            }
          }

      - name: Upload Windows Server 2016 test binaries
        uses: actions/upload-artifact@v4
        with:
          name: codex-windows-server-2016-x64-msvc
          path: codex-rs/target/x86_64-pc-windows-msvc/release/stage-windows-server-2016/*
